name: windows-installer

on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require approved controls source
        shell: pwsh
        run: |
          if (-not (Test-Path "deployment/runtime/controls/server.py")) {
            throw "SHIBLI-controls source missing at deployment/runtime/controls"
          }
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build offline installer
        run: .\deployment\scripts\build-windows.ps1
      - name: Audit staging
        shell: pwsh
        run: |
          if (Test-Path "dist\ShibliC2\.venv") { throw ".venv leaked into staging" }
          if (-not (Test-Path "dist\ShibliC2\ShibliC2.exe")) { throw "missing ShibliC2.exe" }
          if (-not (Test-Path "dist\ShibliControls\ShibliControls.exe")) { throw "missing ShibliControls.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: ShibliC2-Setup-v1.0
          path: release/v1.0/ShibliC2-Setup-v1.0.exe
          if-no-files-found: error
