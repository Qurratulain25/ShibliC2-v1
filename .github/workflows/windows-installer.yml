name: windows-installer

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Authenticode-sign EXEs and the Inno installer (requires internal SHIBLI PKI secrets)"
        type: boolean
        default: false

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require approved controls source
        shell: pwsh
        run: |
          if (-not (Test-Path "deployment/runtime/controls/server.py")) {
            throw "SHIBLI-controls source missing at deployment/runtime/controls"
          }
      - name: Require Windows SHA256 pins
        shell: pwsh
        run: |
          $pins = Get-Content "deployment/runtime/pins.json" -Raw | ConvertFrom-Json
          $required = @(
            @{ Name = "go2rtc.win64_url"; Value = $pins.go2rtc.win64_url },
            @{ Name = "go2rtc.win64_sha256"; Value = $pins.go2rtc.win64_sha256 },
            @{ Name = "ffmpeg.windows_url"; Value = $pins.ffmpeg.windows_url },
            @{ Name = "ffmpeg.windows_sha256"; Value = $pins.ffmpeg.windows_sha256 },
            @{ Name = "webview2.windows_url"; Value = $pins.webview2.windows_url },
            @{ Name = "webview2.windows_sha256"; Value = $pins.webview2.windows_sha256 },
            @{ Name = "vc_redist.windows_url"; Value = $pins.vc_redist.windows_url },
            @{ Name = "vc_redist.windows_sha256"; Value = $pins.vc_redist.windows_sha256 }
          )
          foreach ($item in $required) {
            if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
              throw "Missing required Windows pin: $($item.Name)"
            }
          }
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Materialize Authenticode material
        shell: pwsh
        env:
          SHIBLI_SIGN_REQUESTED: ${{ github.event.inputs.sign }}
          SHIBLI_SIGN_ENABLED_SECRET: ${{ secrets.SHIBLI_SIGN_ENABLED }}
          SHIBLI_SIGN_PFX_BASE64: ${{ secrets.SHIBLI_SIGN_PFX_BASE64 }}
          SHIBLI_SIGN_PFX_PASSWORD: ${{ secrets.SHIBLI_SIGN_PFX_PASSWORD }}
          SHIBLI_SIGN_ROOT_CERT_BASE64: ${{ secrets.SHIBLI_SIGN_ROOT_CERT_BASE64 }}
        run: |
          $enabled = ($env:SHIBLI_SIGN_REQUESTED -eq "true") -or ($env:SHIBLI_SIGN_ENABLED_SECRET -in @("1","true","yes","on"))
          if (-not $enabled) {
            Write-Host "Authenticode signing disabled for this run."
            "SHIBLI_SIGN_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          $env:SHIBLI_SIGN_ENABLED = "true"
          . .\deployment\scripts\sign-windows.ps1
          Initialize-ShibliSigning
      - name: Build offline installer
        env:
          SHIBLI_SIGN_PFX_PASSWORD: ${{ secrets.SHIBLI_SIGN_PFX_PASSWORD }}
          SHIBLI_SIGN_ROOT_CERT_BASE64: ${{ secrets.SHIBLI_SIGN_ROOT_CERT_BASE64 }}
          SHIBLI_SIGN_TIMESTAMP_URL: ${{ vars.SHIBLI_SIGN_TIMESTAMP_URL }}
        run: .\deployment\scripts\build-windows.ps1
      - name: Verify Authenticode when signing is enabled
        shell: pwsh
        env:
          SHIBLI_SIGN_ROOT_CERT_BASE64: ${{ secrets.SHIBLI_SIGN_ROOT_CERT_BASE64 }}
        run: |
          if ($env:SHIBLI_SIGN_ENABLED -ne "true") {
            Write-Host "Skipping signature verification because signing was not enabled."
            return
          }
          . .\deployment\scripts\sign-windows.ps1
          Import-ShibliInternalRoot
          $files = @(
            "dist\ShibliC2\ShibliC2.exe",
            "dist\ShibliControls\ShibliControls.exe",
            "release\v1.0\ShibliC2-Setup-v1.0.exe"
          )
          foreach ($path in $files) {
            Assert-ShibliAuthenticode -Path $path
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") {
              throw "Authenticode verification failed for $path (status=$($sig.Status))"
            }
          }
      - name: Audit offline Windows artifacts
        shell: pwsh
        run: |
          if (Test-Path "dist\ShibliC2\.venv") { throw ".venv leaked into staging" }
          $required = @(
            "deployment/runtime/windows/go2rtc.exe",
            "deployment/runtime/windows/ffmpeg.exe",
            "deployment/runtime/windows/MicrosoftEdgeWebView2RuntimeInstallerX64.exe",
            "deployment/runtime/windows/vc_redist.x64.exe",
            "dist/ShibliC2/ShibliC2.exe",
            "dist/ShibliControls/ShibliControls.exe",
            "release/v1.0/ShibliC2-Setup-v1.0.exe",
            "release/v1.0/SHA256SUMS-windows.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing $path" }
          }
          $pyds = Get-ChildItem "dist\ShibliC2\_internal" -Recurse -Filter "_sqlite3*.pyd" |
            Where-Object { $_.FullName -match "sqlcipher3" }
          if (-not $pyds) { throw "sqlcipher3/_sqlite3*.pyd missing from frozen tree" }
      - uses: actions/upload-artifact@v4
        with:
          name: ShibliC2-Setup-v1.0
          path: |
            release/v1.0/ShibliC2-Setup-v1.0.exe
            release/v1.0/SHA256SUMS-windows.txt
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        shell: pwsh
        run: |
          . .\deployment\scripts\sign-windows.ps1
          Clear-ShibliSignMaterial
